name: Backend tests

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (incl. golden-set regression gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tests/unit is fully mocked (no live Postgres/Redis/Qdrant needed — see
      # tests/unit/conftest.py). This already includes test_langsmith_evals.py,
      # the offline golden-set regression gate (50 approved runs, 90% pass-rate
      # threshold) — no extra step needed to run it.
      #
      # The two ignored files hit a pre-existing, unrelated bug: they spin up a
      # real SQLite engine and the `connectors.connector_metadata` column uses
      # Postgres' JSONB type, which SQLite's compiler can't render. Tracked as a
      # follow-up, not fixed here.
      - name: Run unit tests
        run: |
          pytest tests/unit -v \
            --ignore=tests/unit/test_swiggy_reservation_sync.py \
            --ignore=tests/unit/test_connector_repository.py

  llm-quality-evals:
    name: LLM quality evals (DeepEval + RAGAS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # evals/ sits outside pytest.ini's testpaths, so it's invoked explicitly.
      # Both files pytest.skip() cleanly when GROQ_API_KEY is unset, so this job
      # is safe to run even before the secret is configured — it just won't
      # assert anything until it is.
      - name: Run DeepEval + RAGAS quality evals
        run: |
          pytest evals/test_deepeval_quality.py evals/test_ragas_complaint.py -v
