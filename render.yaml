# Render Blueprint — optional one-click infra for the CareOps API.
# Docs: docs/DEPLOY.md
#
# After deploy: open the Render shell and run the seed scripts once (see DEPLOY.md).

databases:
  - name: careops-postgres
    plan: free
    databaseName: careops
    user: careops

services:
  - type: redis
    name: careops-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: careops-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements-prod.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: POSTGRES_URL
        fromDatabase:
          name: careops-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: careops-redis
          property: connectionString
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
